version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: lucil_ai_db
    environment:
      POSTGRES_USER: lucil_user
      POSTGRES_PASSWORD: lucil_password
      POSTGRES_DB: lucil_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
